---
- name: Upgrade OS packages
  apt:
    upgrade: dist
    update_cache: true
  when:
    - ansible_os_family == "Debian"
    - maintenance_tasks.upgrade_system

- name: Docker prune
  command: docker system prune -af
  when:
    - maintenance_tasks.docker_prune
    - docker_check.rc == 0

- name: Upgrade packages via pip-review
  command: pip-review --auto
  when: maintenance_tasks.upgrade_pip_packages
  failed_when: false

- name: Upgrade pip and ansible
  pip:
    name:
      - pip
      - ansible
    state: latest
  when: maintenance_tasks.upgrade_ansible

# /*********/
# Update package cache
- name: Update package cache
  package:
    update_cache: true

# Manage default packages
- name: Manage default packages
  package:
    name: "{{ apt_def_pckg_lst }}"
    state: "{{ 'present' if instl_def_pckg else 'absent' }}"
  when: instl_def_pckg or not kill_remove

# Install host-specific packages
- name: Install host-specific packages
  package:
    name: "{{ apt_host_pckg_lst }}"
    state: present
  when: apt_host_pckg_lst | default([]) | length > 0

# Install utility packages
- name: Install utility packages
  package:
    name: "{{ apt_util_lst }}"
    state: present
  when: instl_utl_pckg
  register: utility_status

# Retry utilities one by one if bulk install failed
- name: Retry utility packages individually
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ apt_util_lst }}"
  when:
    - instl_utl_pckg
    - utility_status is failed

# Remove utility packages
- name: Remove utility packages
  package:
    name: "{{ apt_util_lst }}"
    state: absent
  when:
    - not instl_utl_pckg
    - not kill_remove

# Install pip packages
- name: Install pip packages
  pip:
    name: "{{ pip_host_pckg_lst }}"
    state: present
  when: instl_ansbl_pckg

# Manage common services
- name: Manage services
  service:
    name: "{{ item }}"
    state: "{{ 'started' if sysd_strt_srvc else 'stopped' }}"
    enabled: "{{ sysd_strt_srvc }}"
  loop: "{{ apt_strt_srvc_lst }}"
  when: sysd_strt_srvc or not kill_remove

# Start host-specific services
- name: Start host-specific services
  service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ apt_hst_strt_srvc_lst | default([]) }}"
  when: apt_hst_strt_srvc_lst | default([]) | length > 0