---
- name: Configure the FileBot APT repository
  when: instl_filebot_pckg
  block:
    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download FileBot's signing key
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --location
          - --silent
          - --show-error
          - --output
          - /etc/apt/keyrings/filebot.asc.tmp
          - https://raw.githubusercontent.com/filebot/plugins/master/gpg/maintainer.pub
        creates: /etc/apt/keyrings/filebot.asc

    - name: Install FileBot's signing key
      ansible.builtin.command:
        argv:
          - install
          - -m
          - "0644"
          - /etc/apt/keyrings/filebot.asc.tmp
          - /etc/apt/keyrings/filebot.asc
        creates: /etc/apt/keyrings/filebot.asc

    - name: Remove temporary FileBot signing key file
      ansible.builtin.file:
        path: /etc/apt/keyrings/filebot.asc.tmp
        state: absent

    - name: Remove the legacy FileBot repository entry
      ansible.builtin.apt_repository:
        repo: deb [arch=all] https://get.filebot.net/deb/ universal main
        state: absent
        update_cache: false

    - name: Add FileBot repository with its scoped signing key
      ansible.builtin.apt_repository:
        repo: deb [arch=all signed-by=/etc/apt/keyrings/filebot.asc] https://get.filebot.net/deb/ universal main
        filename: filebot
        state: present
        mode: "0644"
        update_cache: true

- name: Install FileBot packages
  ansible.builtin.package:
    name:
      - filebot
      - ffmpeg
      - libavcodec-extra
      - x264
      - default-jdk
    state: present
  when: instl_filebot_pckg
