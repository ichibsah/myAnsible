---
- name: Install Docker CE on Debian 13
  when: instl_docker_pckg
  block:
    - name: Install Docker APT prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official APT signing key
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --location
          - --silent
          - --show-error
          - --output
          - /etc/apt/keyrings/docker.asc.tmp
          - https://download.docker.com/linux/debian/gpg
        creates: /etc/apt/keyrings/docker.asc

    - name: Install Docker's APT signing key
      ansible.builtin.command:
        argv:
          - install
          - -m
          - "0644"
          - /etc/apt/keyrings/docker.asc.tmp
          - /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc

    - name: Remove temporary Docker signing key file
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc.tmp
        state: absent

    - name: Detect Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: docker_deb_architecture
      changed_when: false

    - name: Configure Docker's official APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ docker_deb_architecture.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine, CLI, plugins, and Python SDK
      ansible.builtin.apt:
        name: "{{ apt_docker_pckg_lst }}"
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add ibrahim to the docker group
      ansible.builtin.user:
        name: ibrahim
        groups: docker
        append: true

- name: Remove Docker packages
  ansible.builtin.apt:
    name: "{{ apt_docker_pckg_lst }}"
    state: absent
  when: not instl_docker_pckg and not kill_remove
