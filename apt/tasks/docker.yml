---
###############################################################################
# Docker installation and removal
# Reference:
# https://computingforgeeks.com/install-docker-ce-on-linux-systems/
###############################################################################

# -----------------------------------------------------------------------------
# Configure Docker's signing key and APT repository
# -----------------------------------------------------------------------------
- name: Check for Plesk-managed Docker repository
  ansible.builtin.stat:
    path: /etc/apt/keyrings/plesk-ext-docker.gpg
  register: plesk_docker_keyring

- name: Define Docker APT repository
  ansible.builtin.set_fact:
    apt_docker_repository: >-
      deb [arch={{ [ansible_architecture]
                   | map('extract', deb_architecture)
                   | first }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/{{ ansible_system | lower }}/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable

- name: Remove the duplicate Docker repository when Plesk manages it
  ansible.builtin.apt_repository:
    repo: "{{ apt_docker_repository }}"
    state: absent
    update_cache: false
  when: plesk_docker_keyring.stat.exists

- name: Install Docker APT prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  when: not plesk_docker_keyring.stat.exists

- name: Job 20.01 | Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: not plesk_docker_keyring.stat.exists

- name: Job 20.02 | Install Docker CE APT signing key
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --location
      - --silent
      - --show-error
      - --output
      - /etc/apt/keyrings/docker.asc.tmp
      - "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    creates: /etc/apt/keyrings/docker.asc
  when: not plesk_docker_keyring.stat.exists

- name: Install Docker CE APT signing key
  ansible.builtin.command:
    argv:
      - install
      - -m
      - "0644"
      - /etc/apt/keyrings/docker.asc.tmp
      - /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.asc
  when: not plesk_docker_keyring.stat.exists

- name: Remove temporary Docker signing key file
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc.tmp
    state: absent
  when: not plesk_docker_keyring.stat.exists

- name: Job 20.03 | Add Docker CE APT repository
  ansible.builtin.apt_repository:
    repo: "{{ apt_docker_repository }}"
    state: present
    mode: "0644"
    update_cache: true
    validate_certs: true
  when: not plesk_docker_keyring.stat.exists

# -----------------------------------------------------------------------------
# Ensure required Python tooling is installed system-wide
# -----------------------------------------------------------------------------
- name: Job 20.04 | Install system Python and pip packages
  apt:
    pkg:
      - python3
      - python3-apt
      - python3-pip
      - python3-full
      - pip
    state: latest

# -----------------------------------------------------------------------------
# Install Docker packages via APT
# -----------------------------------------------------------------------------
- name: Job 20.05 | Install Docker packages
  apt:
    pkg: "{{ apt_docker_pckg_lst }}"
    state: present
    update_cache: true
  when: instl_docker_pckg

# -----------------------------------------------------------------------------
# Install Docker Python modules (required for Ansible docker_* modules)
# -----------------------------------------------------------------------------
- name: Job 20.06 | Install Docker Python modules
  pip:
    name: "{{ pip_dckr_pckg_lst }}"
    state: present
  when: instl_docker_pckg

# -----------------------------------------------------------------------------
# Remove Docker packages (cleanup mode)
# -----------------------------------------------------------------------------
- name: Job 20.07 | Remove Docker APT packages
  apt:
    pkg: "{{ apt_docker_pckg_lst }}"
    state: absent
  when: not instl_docker_pckg and not kill_remove

- name: Job 20.08 | Remove Docker Python modules
  pip:
    name: "{{ pip_dckr_pckg_lst }}"
    state: absent
  when: not instl_docker_pckg and not kill_remove

###############################################################################
# User and group configuration
# These tasks must run last
###############################################################################

# -----------------------------------------------------------------------------
# Ensure docker group exists
# -----------------------------------------------------------------------------
- name: Job 21.98 | Ensure docker group exists
  group:
    name: docker
    state: present

# -----------------------------------------------------------------------------
# Add user to docker group
# -----------------------------------------------------------------------------
- name: Job 21.99 | Add user to docker group
  user:
    name: ibrahim
    groups: docker
    append: true
# ``
