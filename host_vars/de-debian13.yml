---
# Host-specific overrides grouped by the role categories in 00-defaults.yml.
# Values matching role defaults are omitted.

# Host identity
hostname_additional_hosts:
  - ip_address: 10.1.0.201
    hostname: de-debian13.skyline.lan
    hostname_short: de-debian13
  - ip_address: 192.168.77.201
    hostname: de-debian13.skyline.lan
    hostname_short: de-debian13
  - ip_address: 192.168.0.201
    hostname: de-debian13.skyline.lan
    hostname_short: de-debian13

# Host-specific Ansible connection settings
ansible_become_pass: "{{ localhost_become_pass }}"

# Provisioning overrides
prvs_copy_home: false
addLocalUser: true

# APT and package overrides
addresolv: true
instl_utl_pckg: true
instl_ansbl_pckg: true
instl_docker_pckg: true
apt_host_pckg_lst:
  - cifs-utils
  - isc-dhcp-common
  - isc-dhcp-server
  - kubectx
  - python3-docker
  - docker-cli
pip_host_pckg_lst:
  - docker

# Configuration and service overrides
odoo_keep_alive: true
instl_dhcp_srvc: false
dsbl_dhcpvsx: true
dsbl_dhcpvsx_regx: "INTERFACESv4='eno1'"
copy_iptables: false
strt_myiptbls_at_boot: false
gnomerdp: false
docker3: true

# Docker deployment overrides
dkr_copy_def_files: false
dckr_dpl_pihole: true
dckr_dpl_semaphore: true
dckr_dpl_npxymgmt: true
dckr_dpl_gravity: true
dckr_dpl_homepage: true
dckr_dpl_wud: true
dckr_dpl_webcheck: true
dckr_dpl_uptmkm: true
dckr_dpl_n8n: true

# Host-specific local accounts
localusers:
  - name: mobile
    shell: /bin/bash
    groups:
      - mobile
    append: false
    state: present
    key: mobile.pub
    create_home: true
    local: true
    hosts: de-debian13
  - name: lady
    shell: /bin/bash
    groups:
      - sudo
      - docker
    append: true
    state: present
    key: lady.pub
    gen_ssh_key: true
    create_home: true
    local: true
