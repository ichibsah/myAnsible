---
hostname_additional_hosts:
  - ip_address: 192.168.77.213
    hostname: gitlab.skyline.lan
    hostname_short: gitlab

# first time init
# ansible_remote_user: vagrant
# ansible_ssh_user: vagrant
# ansible_ssh_password: '{{ jenkins_become_pass }}'
# ansible_become_pass: '{{ jenkins_become_pass }}'
#
#
ansible_become_pass: '{{ localhost_become_pass }}'
#
### PRVS | CONFIG ###
prvs_root_passwd: true                     # update root passward
#
#
#
#
dckr_fldr_lst:                            # Docker folder list that will be copied when set in the host variable
  - {fldr: "gitlab"}


#
#
### APT | PACKAGES INSTALL ###
instl_utl_pckg: true                        # Install complete packages. A 'no' will remove it from the host (apt_util_lst)
instl_ansbl_pckg: true                      # Install ansible using PIP (pip_ansbl_pckg_lst apt_ansbl_pckg_lst)
instl_docker_pckg: true                    # Install Docker package (apt_docker_pckg_lst)
#  - systemctl
#  - systemd
